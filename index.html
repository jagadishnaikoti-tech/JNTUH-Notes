    <script>
      // Consent Mode default. When VITE_REQUIRE_CONSENT=true, analytics storage
      // stays "denied" until the visitor accepts the on-site banner, which calls
      // gtag("consent","update") from src/lib/analytics.js.
      (function () {
        var requireConsent = "%VITE_REQUIRE_CONSENT%" === "true";
        var stored = null;
        try {
          stored = window.localStorage.getItem("ln:analytics-consent");
        } catch (e) {}
        var granted = !requireConsent || stored === "granted";

        window.dataLayer = window.dataLayer || [];
        function gtag() {
          dataLayer.push(arguments);
        }
        window.gtag = gtag;
        gtag("js", new Date());
        gtag("consent", "default", {
          ad_storage: "denied",
          ad_user_data: "denied",
          ad_personalization: "denied",
          analytics_storage: granted ? "granted" : "denied"
        });

        gtag("config", "G-VQGHZND2J7");
      })();
    </script>

    <!-- Apply the saved theme before paint to avoid a flash of the wrong mode.
         The site default is dark; the visitor's explicit choice wins. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ln:theme");
          var theme =
            stored === "dark" || stored === "light" ? stored : "dark";
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta)
            meta.setAttribute(
              "content",
              theme === "dark" ? "#16120f" : "#fffbeb"
            );
        } catch (e) {}
      })();
    </script>
