<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JNTUH Notes | B.Tech CSE &amp; AIML Study Material</title>
    <meta
      name="description"
      content="JNTUH Notes: free B.Tech CSE & AIML study material for the R22 regulation, including subject notes, important and guaranteed questions, short questions and previous question papers, each linked to its original document."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#fffbeb" />

    <!-- Apply the saved theme before paint to avoid a flash of the wrong mode.
         The site default is dark; the visitor's explicit choice wins. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ln:theme");
          var theme =
            stored === "dark" || stored === "light" ? stored : "dark";
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta)
            meta.setAttribute(
              "content",
              theme === "dark" ? "#16120f" : "#fffbeb"
            );
        } catch (e) {}
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
