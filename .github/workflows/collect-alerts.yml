# ---------------------------------------------------------------------------
# JNTUH Alert Radar - automatic notice collection (STAGING PROJECT ONLY)
#
# Two-project layout
#   Production:  `jntuh-notes-6ef74`   - public `alerts`, users, settings, ...
#   Staging:     `jntuh-notes-staging` - `ingestItems`, `ingestRuns`,
#                                        `ingestSourceHealth`
#
#   This workflow writes ONLY to the staging project's `(default)` Firestore
#   database. The collector credential is a service account in the staging
#   project and has no IAM on production, so a bug or a misconfiguration cannot
#   read or write `alerts` (see collector/SECURITY.md). An administrator then
#   reviews each staged notice at /admin/ingest and promotes it to a private
#   draft in production. Publishing stays a separate, admin-only action.
#
#   It can NEVER publish anything. The collector has no code path that writes
#   the public `alerts` collection, and firestore.rules requires admin-only
#   verification metadata before an alert may be `published`.
#
# Authentication: Workload Identity Federation (no long-lived key)
#   The job requests a short-lived GitHub OIDC token and exchanges it for
#   impersonated staging service-account credentials. The repository needs:
#     vars.GCP_WORKLOAD_IDENTITY_PROVIDER
#        projects/<staging-project-number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#     vars.GCP_COLLECTOR_SERVICE_ACCOUNT
#        jntuh-staging-collector@jntuh-notes-staging.iam.gserviceaccount.com
#   Setup commands are in collector/SCHEDULING.md ("Workload Identity
#   Federation"). No service-account JSON key is created or stored.
#
# SCHEDULING IS DISABLED
#   The only trigger below is a manual `workflow_dispatch`. Nothing runs on a
#   timer, and a staging run additionally requires the repository variable
#   COLLECTOR_STAGING_ENABLED=true, which only the repository owner can set.
#   Read collector/SCHEDULING.md before enabling anything.
#
# To enable the timer (a deliberate, reviewed change):
#   1. uncomment the `schedule:` block in `on:`;
#   2. set repository variable COLLECTOR_STAGING_ENABLED=true;
#   3. confirm the WIF provider condition still allows the branch/event.
# ---------------------------------------------------------------------------
name: Collect JNTUH notices (staging project only)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (read-only, default) or stage (write to the staging project)"
        type: choice
        options:
          - dry-run
          - stage
        default: dry-run
        required: true
      max_items:
        description: "Maximum NEW staged notices for this run (1-300)"
        type: string
        default: "100"
        required: true
  # Uncomment ONLY after the rollout is approved (collector/SCHEDULING.md).
  # schedule:
  #   - cron: "17 */6 * * *"   # 00:17, 06:17, 12:17 and 18:17 UTC

# Least privilege: read the repository, plus the OIDC token that Workload
# Identity Federation exchanges for short-lived staging credentials. No write
# permission on the repository, no long-lived cloud secret.
permissions:
  contents: read
  id-token: write

# Never let two runs overlap: a second concurrent run would re-read and re-plan
# the same sources.
concurrency:
  group: collector-staging
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Recommended hardening: uncomment to require a manual approval before any
    # collection job runs.
    # environment: collector-staging
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        # firebase-admin (a devDependency) is what the staging write path uses.
        run: npm ci

      - name: Guard - staging requires the owner-set repository variable
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'stage' }}
        env:
          STAGING_ENABLED: ${{ vars.COLLECTOR_STAGING_ENABLED }}
        run: |
          if [ "$STAGING_ENABLED" != "true" ]; then
            echo "::error::Staging is disabled. Set the repository variable COLLECTOR_STAGING_ENABLED=true only after approval (see collector/SCHEDULING.md)."
            exit 1
          fi

      - name: Guard - Workload Identity Federation is configured
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'stage' }}
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          COLLECTOR_SERVICE_ACCOUNT: ${{ vars.GCP_COLLECTOR_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$COLLECTOR_SERVICE_ACCOUNT" ]; then
            echo "::error::Set repository variables GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_COLLECTOR_SERVICE_ACCOUNT (see collector/SCHEDULING.md)."
            exit 1
          fi
          case "$COLLECTOR_SERVICE_ACCOUNT" in
            jntuh-staging-collector@jntuh-notes-staging.iam.gserviceaccount.com) ;;
            *)
              echo "::error::GCP_COLLECTOR_SERVICE_ACCOUNT must be jntuh-staging-collector@jntuh-notes-staging.iam.gserviceaccount.com."
              exit 1
              ;;
          esac

      - name: Authenticate to the staging project (Workload Identity Federation)
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'stage' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_COLLECTOR_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Run the collector
        env:
          COLLECTOR_MODE: ${{ (github.event_name == 'schedule' || inputs.mode == 'stage') && 'stage' || 'dry-run' }}
          COLLECTOR_STAGING_ENABLED: ${{ vars.COLLECTOR_STAGING_ENABLED }}
          # Pinned in code too: the policy refuses anything else.
          COLLECTOR_PROJECT_ID: jntuh-notes-staging
          COLLECTOR_DATABASE_ID: "(default)"
          COLLECTOR_MAX_ITEMS: ${{ inputs.max_items }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          CI: "true"
        run: node collector/scheduledRun.mjs
